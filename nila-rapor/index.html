<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let nilai
        nilai = prompt('Berapa nilai mu');
        if (isNaN(nilai)){
            console.log('Tidak ada nilai')
        }else if (nilai <= -1) {
            console.log("Hanya Positif")
        }else if (prompt = closed){
            console.log('tidak ada nilai karna kosong')
        }
        else if (nilai <= 50){
            console.log('tidak valid')
        }else if (nilai <= 70) {
            console.log('C')
        }else if (nilai <= 85) {
            console.log('B')
        }else if (nilai <= 100) {
            console.log('A')
        }
        else {
            console.log("Tidak ada nilai")
        }
    </script>
</body>
</html>
